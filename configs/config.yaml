defaults:
  - dataset: baseline/cholec_seg8k
  - training: baseline/cholec_seg8k
  - model: baseline/unet
  - _self_

experiment:
  seed: 42
  debug: false

paths:
  data: /work/tesi_cmininno/dataset
  output: ${hydra:runtime.cwd}/experiments
  checkpoint: /work/tesi_cmininno/checkpoint/${name}/${model.name}

device: cuda

logging:
  wandb:
    enabled: true
    project: surgical_scene_segmentation
    entity: mininnoclaudio-unimore
    mode: online

  experiment_name: ${name}_${model.name}
  tags: []

checkpoint:
  save_last: true
  save_every_n_epochs: null
  upload_best_to_wandb: true
  upload_last_to_wandb: false

resume:
  enabled: false
  auto: false
  checkpoint_path: null
  wandb_run_id: null
  wandb_artifact: null
  epoch: null
  resume_wandb: true