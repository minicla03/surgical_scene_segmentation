defaults:
  - dataset: baseline/cholec_seg8k
  - training: baseline/cholec_seg8k
  - model: baseline/unet
  - _self_

experiment:
  seed: 42
  debug: false

paths:
  data: /work/tesi_cmininno/dataset
  output: ${hydra:runtime.cwd}/experiments
  checkpoint: /work/tesi_cmininno/checkpoint/${name}/${model.name}

output_dir: ${paths.checkpoint}

device: cuda

logging:
  wandb:
    enabled: true
    project: surgical_scene_segmentation
    entity: mininnoclaudio-unimore
    mode: online
    group: null        # e.g. same value for several seeds of one experiment
    notes: null

  qualitative:
    enabled: true
    frequency: 1       # every N validation epochs
    num_worst: 4       # lowest per-image Dice
    num_best: 2        # highest per-image Dice
    num_random: 2      # uniformly sampled (fixed seed)
    exclude_classes: []  # class ids ignored when scoring images (e.g. [0] for background)

  experiment_name: ${name}_${model.name}
  tags: []

checkpoint:
  save_last: true
  save_every_n_epochs: null
  upload_best_to_wandb: true
  upload_last_to_wandb: false

resume:
  enabled: false
  auto: false
  checkpoint_path: null
  wandb_run_id: null
  wandb_artifact: null
  epoch: null
  resume_wandb: true