defaults:
  - dataset: baseline/cholec_seg8k
  - training: baseline/cholec_seg8k
  - model: baseline/unet
  - _self_

experiment:
  seed: 42
  # true: one run per seed on the same (official) split. Names, group, tags and checkpoint
  # directory get the seed, so the runs do not collide (set by the submit scripts).
  seed_runs: false
  debug: false

paths:
  data: /work/tesi_cmininno/dataset
  output: ${hydra:runtime.cwd}/experiments
  checkpoint: /work/tesi_cmininno/checkpoint/${name}/${model.name}

output_dir: ${paths.checkpoint}

device: cuda

logging:
  wandb:
    enabled: true
    project: surgical_scene_segmentation
    entity: mininnoclaudio-unimore
    mode: online
    group: null        # e.g. same value for several seeds of one experiment
    notes: null

  qualitative:
    enabled: true
    frequency: 10      # every N validation epochs (best and last epoch are always logged at the end)
    num_worst: 4       # lowest per-image Dice
    num_best: 2        # highest per-image Dice
    num_random: 2      # uniformly sampled (fixed seed)
    exclude_classes: []  # class ids ignored when scoring images (e.g. [0] for background)

  experiment_name: ${name}_${model.name}
  tags: []

checkpoint:
  save_last: true
  save_every_n_epochs: null
  # W&B: ONCE, at the end of the training, the weights (no optimizer state) of the best epoch and of
  # the last epoch, as the model artifacts <name>_best and <name>_last. Nothing is uploaded during the
  # training. Locally, best_*.pt / last_*.pt (full, for the resume) and weights_best_*.pt /
  # weights_last_*.pt (weights only) are overwritten.
  upload_best_to_wandb: true
  upload_last_to_wandb: true

resume:
  enabled: false
  auto: false
  checkpoint_path: null
  wandb_run_id: null
  wandb_artifact: null
  epoch: null
  resume_wandb: true