# @package _global_

# https://pmc.ncbi.nlm.nih.gov/articles/PMC11022235/


name: cholecseg8k

data:
  name: cholecseg8k

  dataset:
    _target_: src.datasets.cholecseg8k.CholecSeg8kDataset
    root: ${paths.data}/CholecSeg8k

  num_classes: 13

  split:
    # kfold      : group-level K-fold (src/datasets/kfold.py). One process per fold:
    #              python start_experiment.py -m data.split.fold_index=0,1,2,3
    # percentage : single train/val(/test) split (needs train_ratio / val_ratio).
    strategy: kfold

    group_by: video
    seed: 42            # split seed: must be identical across the folds of one CV

    # --- kfold ---
    n_folds: 4
    fold_index: 0
    test_ratio: 0.0     # fraction of videos held out as test BEFORE the K-fold (0 = no test)
    balance: true       # balance the class distribution (pixel share) across the validation folds
    n_restarts: 30      # deterministic restarts of the assignment (seed, seed+1, ...)
    balance_min_pixel_pct: 1.0   # classes below this % of pixels do not enter the balance

    # --- percentage (used only with strategy=percentage) ---
    stratified: true #https://medium.com/gumgum-tech/creating-balanced-multi-label-datasets-for-model-training-and-evaluation-16b6a3a2d912
    train_ratio: 0.7
    val_ratio: 0.3

# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:

  image:
    size: [240, 427]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long

  padding:
    enabled: true
    divisor: 16


# ============================================================
# AUGMENTATION
# ============================================================

augmentation:

  train:
    enabled: true

    horizontal_flip:
      enabled: true
      probability: 0.5

    scaling:
      enabled: true
      range: [-0.1, 0.1]
      probability: 1.0

    gaussian_blur:
      enabled: true
      probability: 0.3
      sigmas: [0.8, 1.4]   # (min, max) of the sampled sigma

    # Disabled: the 256x256 crop padded the 240-px height with synthetic rows and
    # made training differ from the full-image evaluation (other datasets use no crop).
    random_crop:
      enabled: false
      size: [256, 256]

  validation:
    enabled: false

  test:
    enabled: false