# @package _global_

# https://pmc.ncbi.nlm.nih.gov/articles/PMC10583931/
# Official split:
# https://huggingface.co/datasets/nct-tso/dsad

# ============================================================
# DATASET
# ============================================================

name: dsad

data:
  name: dsad

  dataset:
    _target_: src.datasets.dsad_dataset.DSADDataset
    root: ${paths.data}/DSAD
    variant: multi_organ

  num_classes: ${data.class_config.${data.dataset.variant}}

  class_config:
    single_organ: 2
    multi_organ: 8

  split:
    # official : DSAD official train/validation/test split (comparable with the published results).
    #            Spleen is absent from validation AND test: its metrics are N/A.
    #            Variance is estimated with 3 training seeds (experiment.seed), not with folds.
    # kfold    : group-level K-fold (src/datasets/kfold.py), kept available but not used for DSAD.
    strategy: official
    group_by: surgery
    seed: 42            # split seed (kfold only)

    # --- kfold (only with strategy=kfold) ---
    n_folds: 4
    fold_index: 0
    test_ratio: 0.0     # fraction of surgeries held out as test BEFORE the K-fold (0 = no test)
    balance: true       # balance the class distribution (pixel share) across the validation folds
    n_restarts: 30
    balance_min_pixel_pct: 1.0


# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:

  image:
    size: [384, 480]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long


# ============================================================
# AUGMENTATION
# ============================================================

augmentation:

  train:
    enabled: true

    scaling:
      enabled: true
      range: [-0.1, 0.1]
      probability: 0.5

    rotation:
      enabled: true
      range: [-15, 15]
      probability: 0.5

    brightness:
      enabled: true
      probability: 0.5

    contrast:
      enabled: true
      probability: 0.5

  validation:
    enabled: false

  test:
    enabled: false