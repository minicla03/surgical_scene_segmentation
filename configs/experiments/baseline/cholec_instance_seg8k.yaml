# https://pmc.ncbi.nlm.nih.gov/articles/PMC11022235

experiment:
  name: cholecseg8k_baseline


# ============================================================
# DATASET
# ============================================================

data:
  name: cholecseg8k

  root: ${paths.data}/CholecSeg8k

  split:
    type: video_based

    train:
      exclude:
        - 12
        - 43

    validation:
      videos:
        - 17
        - 43

    test:
      videos:
        

  num_classes: 13

  classes:
    0: background
    1: abdominal_wall
    2: liver
    3: gastrointestinal_tract
    4: fat
    5: grasper
    6: connective_tissue
    7: blood
    8: cystic_duct
    9: l_hook_electrocautery
    10: gallbladder
    11: hepatic_vein
    12: liver_ligament


# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:

  image:
    size: [480, 854]

    channel_first: true
    dtype: float32

    normalize: true

  mask:
    channel_first: true
    dtype: long


# ============================================================
# AUGMENTATION
# ============================================================

augmentation:

  train:
    enabled: true

    horizontal_flip:
      enabled: true
      probability: 0.5

    vertical_flip:
      enabled: false

    rotation:
      enabled: true
      range: [-10, 10]
      probability: 0.5

    zoom:
      enabled: true
      range: [0.9, 1.1]
      probability: 0.5

    contrast:
      enabled: false

    gaussian_noise:
      enabled: false

  validation:
    enabled: false

  test:
    enabled: false


# ============================================================
# TRAINING
# ============================================================

train:

  batch_size: 4
  accumulation_steps: 3

  max_epochs: 50
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: scratch

  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.00001

  scheduler:
    name: cosine
    warmup_epochs: 5

  loss:
    name: dice_ce
    dice_weight: 0.5
    ce_weight: 0.5

# ============================================================
# EVALUATION
# ============================================================

evaluation:

  metrics:
    - dice
    - iou
    - hd95

  foreground_only: false

  save_predictions: false


# ============================================================
# LOGGING
# ============================================================

logging:

  experiment_name: cholecseg8k_basic_unet

  tags:
    - cholecseg8k
    - baseline
    - semantic-segmentation
    - 13-class