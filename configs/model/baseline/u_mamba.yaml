name: U-Mamba
family: state_space
task: semantic_segmentation

implementation:
  framework: nnunetv2
  class: UMambaBot

architecture:
  _target_: src.models.umamba_adapter.UMambaWrapper

  input_channels: 3
  num_classes: ${data.num_classes}

  n_stages: 6

  features_per_stage:
    - 32
    - 64
    - 128
    - 256
    - 320
    - 320

  kernel_sizes:
    - [3, 3]
    - [3, 3]
    - [3, 3]
    - [3, 3]
    - [3, 3]
    - [3, 3]

  strides:
    - [1, 1]
    - [2, 2]
    - [2, 2]
    - [2, 2]
    - [2, 2]
    - [1, 1]

  n_conv_per_stage:
    - 2
    - 2
    - 2
    - 2
    - 2
    - 2

  n_conv_per_stage_decoder:
    - 2
    - 2
    - 2
    - 2
    - 2

  deep_supervision: false

pretrained:
  enabled: false
  weights: null
