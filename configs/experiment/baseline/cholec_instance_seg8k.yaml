# @package _global_

# https://pmc.ncbi.nlm.nih.gov/articles/PMC11022235

# ============================================================
# DATASET
# ============================================================

name: cholec_instance_seg8k

data:
  name: cholecseg8k

  dataset:
    _target_: src.datasets.cholecseg8k.CholecSeg8kDataset
    root: ${paths.data}/CholecSeg8k

  split:
    type: video_based

    train:
      exclude:
        - 12
        - 43

    validation:
      videos:
        - 17
        - 43

    test:
      videos: []

  num_classes: 13

  classes:
    0: background
    1: abdominal_wall
    2: liver
    3: gastrointestinal_tract
    4: fat
    5: grasper
    6: connective_tissue
    7: blood
    8: cystic_duct
    9: l_hook_electrocautery
    10: gallbladder
    11: hepatic_vein
    12: liver_ligament


# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:

  image:
    size: [240, 427]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long

  padding:
    enabled: true
    divisor: 16


# ============================================================
# AUGMENTATION
# ============================================================

augmentation:

  train:
    enabled: true

    horizontal_flip:
      enabled: true
      probability: 0.5

    scaling:
      enabled: true
      range: [-0.1, 0.1]
      probability: 1.0

    gaussian_blur:
      enabled: true
      probability: 1.0
      kernel_sizes: [3, 5, 7]
      sigmas: [0.8, 1.1, 1.4]

    random_crop:
      enabled: true
      size: [256, 256]

  validation:
    enabled: false

  test:
    enabled: false


# ============================================================
# TRAINING
# ============================================================

train:
  batch_size: 4
  accumulation_steps: 3

  max_epochs: 50
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: scratch

  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0001
    weight_decay: 0.00001

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${train.max_epochs}

  scaler:
    _target_: torch.cuda.amp.GradScaler

  loss:
    _target_: monai.losses.DiceCELoss
    include_background: true
    to_onehot_y: true
    softmax: true


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  metrics:

    dice:
      _target_: monai.metrics.DiceMetric
      include_background: true
      reduction: mean

    iou:
      _target_: monai.metrics.MeanIoU
      include_background: true
      reduction: mean

    hd95:
      _target_: monai.metrics.HausdorffDistanceMetric
      include_background: true
      percentile: 95
      reduction: mean

  foreground_only: false
  save_predictions: false