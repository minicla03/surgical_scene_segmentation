# @package _global_

name: atlas120k_baseline


data:
  name: atlas120k

  dataset:
    _target_: src.datasets.atlas120k_dataset.ATLAS120KDataset
    root: ${paths.data}/atlas120k

  split:
    type: official
    train: train
    validation: val
    test: test

  num_classes: 30
  background_index: 0

  taxonomy:
    type: consolidated
    num_foreground_classes: 30


preprocessing:
  image:
    size: [512, 768]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long


augmentation:
  train:
    enabled: true

    scaling:
      enabled: true
      range: [-0.10, 0.10]
      probability: 0.5

    rotation:
      enabled: true
      range: [-15, 15]
      probability: 0.5

    horizontal_flip:
      enabled: true
      probability: 0.5

    vertical_flip:
      enabled: false

  validation:
    enabled: false

  test:
    enabled: false


train:
  batch_size: 24
  accumulation_steps: 1

  max_epochs: 10
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: imagenet

  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.00001

  scheduler:
    name: cosine
    warmup_epochs: 0

  loss:
    name: dice_bce
    dice_weight: 5.0
    bce_weight: 5.0


model:
  name: baseline


evaluation:
  metrics:
    miou:
      _target_: monai.metrics.MeanIoU
      include_background: false
      reduction: mean

    dice:
      _target_: monai.metrics.DiceMetric
      include_background: false
      reduction: mean

    ap:
        enabled: true

    ap50:
      enabled: true

    ap75:
      enabled: true

  foreground_only: true
  num_foreground_classes: 30
  save_predictions: false

logging:
  experiment_name: atlas120k_baseline

  tags:
    - atlas120k
    - baseline
    - semantic-segmentation
    - 30-class