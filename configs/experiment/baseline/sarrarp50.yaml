experiment:
  name: sarrarp50_baseline

data:
  name: sarrarp50

  dataset:
    _target_: src.datasets.sarrarp50_dataset.SARRARP50Dataset
    root: ${paths.data}/SARRARP50

  split:
    type: official

  num_classes: 10


preprocessing:
  image:
    size: [512, 640]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long


augmentation:
  train:
    enabled: true

    scaling:
      enabled: true
      range: [-0.10, 0.10]
      probability: 0.3

    rotation:
      enabled: true
      range: [-10, 10]
      probability: 0.3

    translation:
      enabled: true
      range: [-0.05, 0.05]
      probability: 0.3

    horizontal_flip:
      enabled: true
      probability: 0.5

    vertical_flip:
      enabled: false

    color_jitter:
      enabled: true
      probability: 0.3
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.05

  validation:
    enabled: false

  test:
    enabled: false


train:
  batch_size: 4
  accumulation_steps: 3

  max_epochs: 50
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: scratch

  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-5

  scheduler:
    name: cosine
    warmup_epochs: 5

  loss:
    name: dice_ce
    dice_weight: 0.5
    ce_weight: 0.5


model:
  name: baseline


evaluation:
  metrics:
    dice:
      _target_: monai.metrics.DiceMetric
      include_background: true
      reduction: mean

    iou:
      _target_: monai.metrics.MeanIoU
      include_background: true
      reduction: mean

    hd95:
      _target_: monai.metrics.HausdorffDistanceMetric
      include_background: true
      percentile: 95
      reduction: mean

  foreground_only: false
  save_predictions: false


logging:
  experiment_name: sarrarp50_baseline

  tags:
    - sarrarp50
    - baseline