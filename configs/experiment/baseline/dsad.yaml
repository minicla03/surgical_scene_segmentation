experiment:
  name: dsad_baseline

data:
  name: dsad
  root: ${paths.data}/DSAD

  variant: single_organ

  split:
    type: official
    train: train
    validation: validation
    test: test

  num_classes: 2

  classes:
    0: background
    1: organ

preprocessing:
  image:
    size: [512, 640]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long

augmentation:
  train:
    enabled: true

    horizontal_flip:
      enabled: true
      probability: 0.5

    vertical_flip:
      enabled: false

    rotation:
      enabled: true
      range: [-15, 15]
      probability: 0.5

    zoom:
      enabled: true
      range: [0.9, 1.1]
      probability: 0.5

  validation:
    enabled: false

  test:
    enabled: false

train:
  batch_size: 12
  accumulation_steps: 1

  max_epochs: 50
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: scratch

  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.00001

  scheduler:
    name: cosine
    warmup_epochs: 5

  loss:
    name: dice_focal
    dice_weight: 0.5
    focal_weight: 0.5
    gamma: 1.0

evaluation:
  metrics:
    - dice
    - iou
    - hd95

  save_predictions: false

logging:
  experiment_name: dsad_baseline
  tags:
    - dsad
    - single_organ
    - baseline