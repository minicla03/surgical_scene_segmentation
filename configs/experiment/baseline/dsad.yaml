# @package _global_


# https://pmc.ncbi.nlm.nih.gov/articles/PMC10583931/
# split: https://huggingface.co/datasets/nct-tso/dsad/blob/main


name: dsad_baseline

data:
  name: dsad

  dataset:
    _target_: src.datasets.dsad_dataset.DSADDataset
    root: ${paths.data}/DSAD

  variant: single_organ

  split:
    type: official
    train: train
    validation: validation
    test: test

  num_classes: 2

  classes:
    0: background
    1: organ

preprocessing:
  image:
    size: [512, 640]
    channel_first: true
    dtype: float32
    normalize: true

  mask:
    channel_first: true
    dtype: long

augmentation:
  train:
    enabled: true

    scaling:
      enabled: true
      range: [-0.1, 0.1]
      probability: 0.5

    rotation:
      enabled: true
      range: [-15, 15]
      probability: 0.5

    brightness:
      enabled: true
      probability: 0.5

    contrast:
      enabled: true
      probability: 0.5

  validation:
    enabled: false

  test:
    enabled: false

train:
  batch_size: 12
  accumulation_steps: 1

  max_epochs: 50
  eval_freq: 1

  num_workers: 4
  pin_memory: true

  precision: "16-mixed"

  initialization: scratch

  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.00001

  scheduler:
    name: cosine
    warmup_epochs: 5

  loss:
    name: dice_focal
    dice_weight: 0.5
    focal_weight: 0.5
    gamma: 1.0

evaluation:
  metrics:
    dice:
      _target_: monai.metrics.DiceMetric
      include_background: true
      reduction: mean

    iou:
      _target_: monai.metrics.MeanIoU
      include_background: true
      reduction: mean

    hd95:
      _target_: monai.metrics.HausdorffDistanceMetric
      include_background: true
      percentile: 95
      reduction: mean

  foreground_only: false
  save_predictions: false

logging:
  experiment_name: dsad_baseline
  tags:
    - dsad
    - single_organ
    - baseline