name: umamba

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch 2.0.1 + CUDA 11.8
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118

      # Build dependencies
      - packaging
      - ninja

      # Thesis framework
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.22.3

      - pyarrow=15.0.2

      # Medical image / segmentation
      - monai==1.3.0
      - segmentation-models-pytorch==0.3.3
      - albumentations==1.3.1

      # Transformers / model utilities
      - transformers==4.36.2
      - timm==0.9.2
      - einops==0.7.0

      # Computer vision
      - opencv-python==4.8.0.76
      - Pillow==10.0.0
      - scikit-image==0.21.0
      - pycocotools==2.0.8

      # Scientific stack
      - numpy==1.26.4
      - scipy==1.11.4
      - scikit-learn==1.3.0
      - pandas==2.1.4
      - pyarrow==15.0.2

      # Dataset splitting
      - iterative-stratification==0.1.9

      # Configuration / utilities
      - yacs==0.1.8
      - ml-collections==0.1.1
      - python-dotenv==1.0.0

      # Visualization / training utilities
      - matplotlib==3.8.2
      - tqdm==4.66.1

